<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#0d1117">
  <title>Your AI CSR — ABI Tech</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<main class="app">
  <header>
    <div class="brand"><small>ABI TECH</small><strong>Customer Care</strong></div>
  </header>

  <section class="hero" style="text-align: center; padding: 24px 0;">
    <div class="eyebrow">Agent Dashboard</div>
    <h1 id="agentPanelTitle">Your AI CSR</h1>
  </section>

  <div id="agentEmptyState" style="display:block; max-width: 340px; margin: auto;">
    <section class="hero" style="text-align: center;">
      <div class="eyebrow">No agent yet</div>
      <h1>Create your AI CSR.</h1>
      <p>Your AI customer care agent is one sign-in away.</p>
      <a class="cta primary" id="agentCreateCta" href="/auth">Create My AI CSR</a>
    </section>
  </div>

  <div id="agentPanel" style="display:none; max-width: 340px; margin: auto; margin-top: 24px;">
    <section class="card">
      <div class="row spread">
        <span>Agent</span><strong id="agentPersonaName"></strong>
      </div>
      <div class="row spread">
        <span>Business</span><span id="agentBusinessName"></span>
      </div>
      <div class="row spread">
        <span>Status</span><span id="agentStatus"></span>
      </div>
    </section>

    <div class="field" style="margin: 24px 0 0;">
      <label for="agentPublicUrl">Your Public CSR URL</label>
      <div class="row" style="gap: 8px;">
        <input id="agentPublicUrl" readonly style="flex:1;">
        <button type="button" class="ghost" id="agentCopyUrlBtn" style="width:auto;">Copy</button>
      </div>
    </div>

    <div style="display:flex; gap:8px; margin-top: 16px;">
      <button type="button" class="submit" id="agentLaunchBtn" style="flex:1;">Launch / Test Agent</button>
      <button type="button" class="ghost" id="agentEditBtn" style="width:auto;">Edit Agent</button>
    </div>

    <div class="field" style="margin: 24px 0 0;">
      <label>Website Embed Code</label>
      <textarea id="agentEmbedCodeText" readonly rows="3" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);font-size:12px;"></textarea>
      <button type="button" class="ghost" id="agentCopyEmbedBtn" style="width:auto;margin-top:8px;">Copy</button>
    </div>
  </div>

  <form id="agentLogoutForm" style="margin-top:32px;">

    <button type="submit" class="ghost" id="agentLogoutBtn" style="width:100%;">Sign Out</button>

  </form>
</main>

<script src="./js/config.js"></script>
<script type="module" src="./js/firebase.js"></script>
<script defer src="./js/auth.js"></script>
<script defer src="./js/agents.js"></script>
<script defer src="./js/dashboard.js"></script>
</body>
</html>
